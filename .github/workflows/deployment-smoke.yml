name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Public HTTPS backend origin
        required: true
        type: string
      frontend_url:
        description: Public HTTPS frontend origin
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify deployed services
        env:
          CALORIEAPP_SMOKE_BACKEND_URL: ${{ inputs.backend_url }}
          CALORIEAPP_SMOKE_FRONTEND_URL: ${{ inputs.frontend_url }}
        run: |
          python tools/deployment_smoke_test.py \
            --backend-url "$CALORIEAPP_SMOKE_BACKEND_URL" \
            --frontend-url "$CALORIEAPP_SMOKE_FRONTEND_URL"
