name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-boundary:
    name: Repository boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject tracked secrets and runtime artifacts
        shell: bash
        run: |
          forbidden="$({
            git ls-files \
              | grep -E '(^|/)(\.env($|\.)|node_modules/|\.next/|\.venv/|__pycache__/|[^/]+\.(db|sqlite|sqlite3)$)' \
              | grep -Ev '(^|/)(\.env\.example|[^/]+\.env\.example|[^/]+\.env\.staging\.example)$'
          } || true)"
          if [[ -n "$forbidden" ]]; then
            printf 'Forbidden tracked paths:\n%s\n' "$forbidden" >&2
            exit 1
          fi

      - name: Enforce legal and licensing boundaries
        run: python tools/check_legal_boundaries.py

      - name: Validate Identity Bridge contracts
        run: |
          python tools/sync_identity_contracts.py --check
          python -m unittest tools.tests.test_identity_contracts
          python -m unittest tools.tests.test_localization_contracts

  wordpress-plugin-release-check:
    name: WordPress plugin release check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint WordPress plugin PHP
        run: find wordpress-plugins/calorieapp-identity-bridge -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test legal footer compatibility
        shell: bash
        run: |
          php <<'PHP'
          <?php
          define('ABSPATH', __DIR__);
          require 'wordpress-plugins/calorieapp-identity-bridge/includes/class-calorieapp-identity-bridge-legal-footer-compatibility.php';

          use CalorieApp\IdentityBridge\LegalFooterCompatibility;

          $input = '<p>Chamber of Commerce KVK: 84216352</p>'
              . '<p>Calorie Token • KvK 84216352</p>'
              . '<p>ICTHendrikse &bull; KvK 73774693</p>'
              . '<p>Operator: ICTHendrikse</p>'
              . '<p>© 2023 Calorie Token</p>'
              . '<p>&copy;&nbsp;2026&nbsp;CalorieToken</p>'
              . '<p>Calorie aims to be the World&apos;s food token</p>'
              . '<p>Unrelated content remains unchanged.</p>';
          $output = LegalFooterCompatibility::replace_legacy_footer_html($input);
          $operator = 'Operator: ICTHendrikse · KVK 73774693';
          $copyright = '© 2026 ICTHendrikse (owned content only) · CalorieToken® trade mark: Pieter Hendrikse';

          if (substr_count($output, $operator) !== 4) {
              throw new RuntimeException('Known operator footer variants were not normalized.');
          }
          if (substr_count($output, $copyright) !== 2) {
              throw new RuntimeException('Known copyright footer variants were not normalized.');
          }
          if (!str_contains($output, 'Calorie aims to be the world’s food token')) {
              throw new RuntimeException('The legacy footer tagline was not normalized.');
          }
          if (!str_contains($output, 'Unrelated content remains unchanged.')) {
              throw new RuntimeException('Unrelated rendered content changed.');
          }

          $current = '<footer><p>Calorie aims to be the world’s food token</p>'
              . '<p>' . $operator . '</p><p>' . $copyright . '</p></footer>';
          if (LegalFooterCompatibility::replace_legacy_footer_html($current) !== $current) {
              throw new RuntimeException('The current footer is not idempotent.');
          }
          PHP

      - name: Test WordPress locale registry
        run: php tools/tests/wordpress_locale_registry.test.php

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test deterministic release builder
        run: python -m unittest tools.tests.test_build_wordpress_plugin_release

      - name: Build and inspect release archive
        run: python tools/build_wordpress_plugin_release.py

  backend-tests:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calorieapp_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: calorieapp_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calorieapp_ci -d calorieapp_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.10.1

      - name: Audit backend dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q -W error::DeprecationWarning

      - name: Compile backend Python
        run: python -m compileall -q backend/app

      - name: Verify forward-only schema migration and readiness
        working-directory: backend
        env:
          CALORIEAPP_ENV: test
          DATABASE_URL: sqlite:///${{ runner.temp }}/calorie-schema-smoke.sqlite
        run: |
          python -m app.schema_cli upgrade
          python -m app.schema_cli check

      - name: Verify PostgreSQL migration compatibility
        working-directory: backend
        env:
          CALORIEAPP_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://calorieapp_ci:synthetic_ci_only@127.0.0.1:5432/calorieapp_ci_test
        run: python -m pytest tests/test_postgresql_integration.py -q -W error::DeprecationWarning

  frontend-checks:
    name: Frontend lint and build (Node.js 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test embedded WordPress login readiness
        run: >-
          node --test
          tools/tests/calorieapp_embed_readiness.test.mjs
          tools/tests/identity_locales.test.mjs
          tools/tests/xaman_login_start_retry.test.mjs

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
        run: npm run build
