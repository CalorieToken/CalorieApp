name: Food UX isolated check

on:
  push:
    branches: [repair/food-ux-integration-20260915]
  pull_request:
    branches: [herstel/vervolg-20260915]
    paths:
      - 'frontend/**'
      - 'tools/tests/**'
      - '.github/workflows/food-ux-isolated-check.yml'

permissions:
  contents: read

concurrency:
  group: food-ux-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the source under test
        run: |
          mkdir -p ux-check-evidence
          git rev-parse HEAD > ux-check-evidence/verified-commit.txt
          git rev-parse 'HEAD^{tree}' > ux-check-evidence/verified-tree.txt
          git archive --format=tar.gz -o ux-check-evidence/verified-source.tar.gz HEAD
      - name: Install locked dependencies and test tools
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Full regression suite and production build
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/tests/*.test.mjs 2>&1 | tee ux-check-evidence/regressions.log
          cd frontend
          ./node_modules/.bin/tsc --noEmit 2>&1 | tee ../ux-check-evidence/typecheck.log
          npm run build 2>&1 | tee ../ux-check-evidence/build.log
      - name: Production-browser check with synthetic backend only
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix frontend -- --hostname 127.0.0.1 --port 3100 > ux-check-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:3100/ > /dev/null && break; sleep 1; done
          curl --silent --fail http://127.0.0.1:3100/ > /dev/null
          python tools/tests/browser_food_ux.py 2>&1 | tee ux-check-evidence/browser.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('ux-check-evidence/browser/report.json').read_text())
          assert r['status']=='passed' and not r['errors'], r
          assert len(r['checks']) >= 55 and len(r['writes']) == 1, r
          PY
      - name: Retain test evidence (no publication or deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-ux-browser-evidence
          path: ux-check-evidence/
          retention-days: 3
          if-no-files-found: error
