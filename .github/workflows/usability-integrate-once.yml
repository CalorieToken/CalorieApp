name: Integrate checked usability candidate once

on:
  push:
    branches: [review/usability-20260915]
    paths: [tools/review/usability-payload-2.txt]

permissions:
  contents: read

concurrency:
  group: usability-integration-once
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'CalorieToken/CalorieApp' && github.ref == 'refs/heads/review/usability-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate: ${{ steps.bundle.outputs.candidate }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged application base and unpack exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 682d835236f4d3b3f2e0e59dffa6092f44d41f4e HEAD
          git diff --exit-code 682d835236f4d3b3f2e0e59dffa6092f44d41f4e HEAD -- frontend tools/tests
          mkdir -p /tmp/usability-evidence
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'tools/review/usability-payload-{n}.txt').read_text().strip() for n in (1, 2))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '42c487d19e0d90f77c0c6d1e61468dad764b1eb69fa05332d4b7f60cec9df96c', 'Patch hash mismatch'
          target = pathlib.Path('/tmp/usability-evidence/candidate.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          expected = {
            'frontend/components/FoodSearchPlaceholder.tsx': '36f5fa5ac3ddefccb5fafdb57c71f13e64201feb8402d6f0a0b0d175c5f9f9aa',
            'frontend/components/NutriScoreBar.tsx': '8f954d1c047a34dd272bfad331bd6cb48b88a171b673b40382d92bf9b22b9f64',
            'frontend/components/RecordedGradeSummary.tsx': '5f88ccd822dd897fa39616612445e4f0952f6e352ab1ad08072f86c545f8fec0',
            'frontend/components/UsdaFoodSearch.tsx': '36f41d9fea6f936e7befe482fb0bb72cacd7d09a0e57789e12815e607e541f6c',
            'frontend/config/diary-copy.json': '9866433ad5a6619aec745f5badb68c5b20d815df04158fb44982b7143029f75a',
            'frontend/config/food-experience-copy.json': '5c7bd08aed39513a65a0e35e4a0e4c794d1669000e96187ae06b61bf9485a202',
            'frontend/lib/foodExperience.ts': '0c23e2ca69cc778408d33ea234f88c44b5394930966ea6b799a3411e8c85edbc',
            'tools/tests/display_language_ui.test.mjs': '61a80b2ec2b898494be8dad406c0674f8d4ddbb4c15286c8280ec4ce868d7b32',
            'tools/tests/food_logging_ui.test.mjs': '8386c68e6aa9ac826684d6bd17091fb9b10a43531543e62ad11886a4c2b41fc0',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          pathlib.Path('/tmp/usability-evidence/source-sha256.json').write_text(json.dumps(expected, indent=2) + '\n')
          subprocess.run(['git', 'add', '--', *expected], check=True)
          PY
          git rm .github/workflows/usability-integrate-once.yml tools/review/usability-payload-1.txt tools/review/usability-payload-2.txt
          git diff --cached --check
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Check TypeScript
        working-directory: frontend
        run: npx --no-install tsc --noEmit 2>&1 | tee /tmp/usability-evidence/typescript.log
      - name: Run complete existing Node regression suite
        run: node --test tools/tests/*.test.mjs 2>&1 | tee /tmp/usability-evidence/tests.log
      - name: Build complete frontend
        working-directory: frontend
        run: npm run build 2>&1 | tee /tmp/usability-evidence/build.log
      - name: Bundle the exact tested commit without remote writes
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate tested food usability repair; preserve production and auth flows'
          candidate=$(git rev-parse HEAD)
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$candidate" > /tmp/usability-evidence/commit.txt
          git bundle create /tmp/usability-evidence/candidate.bundle HEAD ^${{ github.sha }}
          git diff --stat ${{ github.sha }} HEAD > /tmp/usability-evidence/changes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-candidate-${{ github.run_id }}
          path: /tmp/usability-evidence
          retention-days: 3

  integrate_review_branch:
    needs: verify
    if: github.repository == 'CalorieToken/CalorieApp' && github.ref == 'refs/heads/review/usability-20260915' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: usability-candidate-${{ github.run_id }}
          path: /tmp/usability-evidence
      - name: Fast-forward only the unchanged isolated review branch
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.verify.outputs.candidate }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/review/usability-20260915'
          test "$(cat /tmp/usability-evidence/commit.txt)" = "$CANDIDATE"
          git bundle verify /tmp/usability-evidence/candidate.bundle
          git fetch /tmp/usability-evidence/candidate.bundle HEAD:refs/candidate/verified
          test "$(git rev-parse refs/candidate/verified)" = "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^")" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/review/usability-20260915 | cut -f1)" = "$EXPECTED_HEAD"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$CANDIDATE:refs/heads/review/usability-20260915"
          echo 'Integrated tested source on review branch only. No merge, production deployment, diary writes, or campaign publication.'
