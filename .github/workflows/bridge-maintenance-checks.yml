name: Bridge maintenance checks

on:
  pull_request:
    branches:
      - fix/bridge-033-status-refresh
      - fix/desktop-widget-column-fit

permissions:
  contents: read

concurrency:
  group: bridge-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Check the shared Step 3 candidate (PHP required)
        run: python tools/check_step3_candidate.py --require-php
      - name: Build the checked local candidate
        run: python tools/build_wordpress_plugin_release.py
